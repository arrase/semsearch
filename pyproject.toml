[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semsearch"
version = "1.0.6"
description = "Linux desktop semantic search engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.8.0",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
    "pymupdf>=1.25.0",
    "pillow>=11.0.0",
    "watchdog>=6.0.0",
    "pynput>=1.7.7",
    "python-docx>=1.1.2",
]

[project.scripts]
semsearch = "semsearch.main:main"

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
dev = [
    "semsearch[test]",
    "ruff==0.17.2",
    "mypy>=2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/semsearch"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "A", "B", "C4", "S", "UP", "SIM", "RUF", "PTH", "PIE",
    "RET", "PERF", "ASYNC", "LOG", "G", "T20", "PL",
]
ignore = [
    # Design-metric rules: thresholds are arbitrary and would force artificial splits.
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    # Module-level runtime state is intentional.
    "PLW0603",
]
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S603"]
"src/semsearch/i18n/**" = ["E501", "RUF001"]
"src/semsearch/gui/**" = ["N802"]
# Queries interpolate only the constant FILE_COLUMNS or int-cast ID lists; user inputs are parameterized.
"src/semsearch/core/database.py" = ["S608"]
# Local ODT Zip archives parse content.xml using standard library ElementTree.
"src/semsearch/extractors/docs.py" = ["S314"]
# Desktop media/action subprocesses invoke trusted system binaries with argument lists (shell=False).
"src/semsearch/extractors/media.py" = ["S603", "S607"]
"src/semsearch/gui/preview.py" = ["S603", "S607"]
"src/semsearch/services/actions.py" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src/semsearch"]
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true
