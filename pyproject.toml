[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semsearch"
version = "1.0.5"
description = "Linux desktop semantic search engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.8.0",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
    "pymupdf>=1.25.0",
    "pillow>=11.0.0",
    "watchdog>=6.0.0",
    "pynput>=1.7.7",
    "python-docx>=1.1.2",
    "pytest>=8.0.0",
]

[project.scripts]
semsearch = "semsearch.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/semsearch"]
